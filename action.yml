name: "packfence — npm pack pre-publish fence"
description: "Fail CI if npm pack would publish source maps, secrets, or other files you did not mean to ship."
author: "Blackman99"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  path:
    description: "Path to the package directory to scan, relative to the repo root (default: .)"
    required: false
    default: "."
  config:
    description: "Optional path to a packfence config JSON file (relative to path)"
    required: false
    default: ""
  fail:
    description: "Fail the step on HOLD findings (true/false)"
    required: false
    default: "true"
  workspaces:
    description: "Scan every publishable npm/Yarn workspace package under path (true/false). Private workspace roots are expanded automatically."
    required: false
    default: "false"
  sarif:
    description: "Write a SARIF 2.1.0 report to this file (e.g. packfence.sarif) for github/codeql-action/upload-sarif. Empty = no SARIF."
    required: false
    default: ""
  version:
    description: "packfence version to install from npm, or 'local' to use action path"
    required: false
    default: "local"

outputs:
  sarif-file:
    description: "Absolute path of the SARIF report, when the sarif input is set"
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install packfence
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PF_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$PF_VERSION" = "local" ]; then
          npm install --ignore-scripts
          npm run build
          echo "PACKFENCE_BIN=${{ github.action_path }}/dist/cli.js" >> "$GITHUB_ENV"
        else
          npm install -g "packfence@$PF_VERSION"
          echo "PACKFENCE_BIN=$(npm root -g)/packfence/dist/cli.js" >> "$GITHUB_ENV"
        fi
    - name: Run packfence
      id: run
      shell: bash
      # Run from the repo root so annotation and SARIF paths are repo-relative.
      working-directory: ${{ github.workspace }}
      env:
        PF_PATH: ${{ inputs.path }}
        PF_CONFIG: ${{ inputs.config }}
        PF_FAIL: ${{ inputs.fail }}
        PF_WORKSPACES: ${{ inputs.workspaces }}
        PF_SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail
        ARGS=("$PF_PATH" --format github-annotations)
        if [ -n "$PF_CONFIG" ]; then
          ARGS+=(--config "$PF_CONFIG")
        fi
        if [ "$PF_FAIL" != "true" ]; then
          ARGS+=(--test)
        fi
        if [ "$PF_WORKSPACES" = "true" ]; then
          ARGS+=(--workspaces)
        fi
        if [ -n "$PF_SARIF" ]; then
          ARGS+=(--sarif "$PF_SARIF")
          echo "sarif-file=$(realpath -m "$PF_SARIF")" >> "$GITHUB_OUTPUT"
        fi
        node "$PACKFENCE_BIN" "${ARGS[@]}"
