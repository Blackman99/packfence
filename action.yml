name: "packfence — npm pack pre-publish fence"
description: "Fail CI if npm pack would publish source maps, secrets, or other files you did not mean to ship."
author: "Blackman99"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  path:
    description: "Path to the package directory to scan (default: .)"
    required: false
    default: "."
  config:
    description: "Optional path to a packfence config JSON file"
    required: false
    default: ""
  fail:
    description: "Fail the step on HOLD findings (true/false)"
    required: false
    default: "true"
  version:
    description: "packfence version to install from npm, or 'local' to use action path"
    required: false
    default: "local"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install packfence
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.version }}" = "local" ]; then
          npm install --ignore-scripts
          npm run build
          echo "PACKFENCE_BIN=${{ github.action_path }}/dist/cli.js" >> "$GITHUB_ENV"
        else
          npm install -g "packfence@${{ inputs.version }}"
          echo "PACKFENCE_BIN=packfence" >> "$GITHUB_ENV"
        fi
    - name: Run packfence
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -euo pipefail
        ARGS=(--format github-annotations)
        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi
        if [ "${{ inputs.fail }}" != "true" ]; then
          ARGS+=(--test)
        fi
        node "$PACKFENCE_BIN" . "${ARGS[@]}"
