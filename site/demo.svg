<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="packfence demo: a monorepo scan holds a source map and a Stripe key, clears the other package">
  <rect width="720" height="320" fill="#0a1628"/>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f4b942" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="720" height="320" fill="url(#scan)"/>
  <style>
    @media (prefers-reduced-motion: reduce) { .moving, .pulse { display: none; } .still { display: inline; } }
    .still { display: none; }
  </style>
  <!-- title bar -->
  <rect x="16" y="12" width="688" height="36" fill="#1a2a40"/>
  <text x="28" y="36" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#f4b942">PACKFENCE — PRE-PUBLISH SCAN</text>
  <text x="692" y="36" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#c5d0dc">--workspaces · 2 bags on the belt</text>
  <!-- belt -->
  <rect x="16" y="62" width="688" height="112" fill="#1a2a40"/>
  <g fill="#0a1628" opacity="0.6">
    <rect x="16" y="166" width="688" height="2"/>
  </g>
  <!-- two suitcases: core (small) then cli (large) -->
  <g class="moving">
    <animateTransform attributeName="transform" type="translate" values="-260 0; 120 0; 120 0; 520 0" keyTimes="0;0.3;0.6;1" dur="5s" repeatCount="indefinite"/>
    <g>
      <rect x="0" y="96" width="70" height="54" rx="6" fill="#2f6f5e"/>
      <rect x="32" y="100" width="6" height="46" fill="#0a1628"/>
      <path d="M18 96 V84 h34 v12" fill="none" stroke="#2f6f5e" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(100 0)">
      <rect x="0" y="88" width="104" height="66" rx="6" fill="#f4b942" opacity="0.9"/>
      <rect x="49" y="92" width="6" height="58" fill="#0a1628"/>
      <rect x="12" y="104" width="26" height="8" fill="#b33a3a"/>
      <rect x="66" y="128" width="22" height="8" fill="#b33a3a"/>
      <path d="M32 88 V74 h40 v14" fill="none" stroke="#f4b942" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <g class="still">
    <rect x="120" y="96" width="70" height="54" rx="6" fill="#2f6f5e"/>
    <rect x="220" y="88" width="104" height="66" rx="6" fill="#f4b942" opacity="0.9"/>
  </g>
  <!-- sweep line -->
  <rect x="300" y="62" width="3" height="112" fill="#f4b942" opacity="0.7">
    <animate class="pulse" attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- findings strip -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">
    <text x="28" y="204" fill="#c5d0dc" opacity="0.72">BAG 1/2 @acme/cli · packages/cli</text>
    <text x="28" y="226" fill="#b33a3a">HOLD<tspan x="86">dist/cli.js.map · sourcesContent</tspan>
      <animate class="pulse" attributeName="fill" values="#f4b942;#b33a3a;#f4b942;#b33a3a" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="248" fill="#b33a3a">HOLD<tspan x="86">lib/config.js:12 · stripe-key [sk_l…r9Qa]</tspan>
      <animate class="pulse" attributeName="fill" values="#b33a3a;#f4b942;#b33a3a;#f4b942" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="276" fill="#c5d0dc" opacity="0.72">BAG 2/2 @acme/core · packages/core</text>
    <text x="28" y="298" fill="#2f6f5e">CLEAR<tspan x="86">2 files · 89B</tspan></text>
  </g>
  <rect x="540" y="214" width="148" height="44" rx="4" fill="#b33a3a"/>
  <text x="614" y="243" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#c5d0dc">HOLD 1/2</text>
  <text x="614" y="290" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#c5d0dc" opacity="0.72">SARIF → Security tab</text>
</svg>
