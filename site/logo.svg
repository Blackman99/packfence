<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="packfence">
  <rect width="512" height="512" fill="none"/>
  <!-- bezel -->
  <rect x="48" y="72" width="416" height="340" rx="8" fill="#0a1628" stroke="#c5d0dc" stroke-width="10"/>
  <!-- inner recess -->
  <rect x="72" y="96" width="368" height="268" fill="#1a2a40"/>
  <!-- scanline hint -->
  <g opacity="0.12" stroke="#f4b942" stroke-width="1">
    <line x1="72" y1="130" x2="440" y2="130"/>
    <line x1="72" y1="160" x2="440" y2="160"/>
    <line x1="72" y1="190" x2="440" y2="190"/>
    <line x1="72" y1="220" x2="440" y2="220"/>
    <line x1="72" y1="250" x2="440" y2="250"/>
    <line x1="72" y1="280" x2="440" y2="280"/>
    <line x1="72" y1="310" x2="440" y2="310"/>
    <line x1="72" y1="340" x2="440" y2="340"/>
  </g>
  <!-- suitcase silhouette (amber phosphor) -->
  <g fill="#f4b942" opacity="0.95">
    <!-- body -->
    <rect x="168" y="180" width="176" height="120" rx="10"/>
    <!-- handle -->
    <path d="M216 180 V158 h80 v22" fill="none" stroke="#f4b942" stroke-width="14" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="196" cy="308" r="12"/>
    <circle cx="316" cy="308" r="12"/>
    <!-- zipper line -->
    <rect x="248" y="188" width="8" height="104" rx="2" fill="#0a1628"/>
  </g>
  <!-- HOLD badge corner -->
  <rect x="360" y="112" width="64" height="22" rx="3" fill="#b33a3a"/>
  <text x="392" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#c5d0dc">HOLD</text>
  <!-- stand -->
  <rect x="200" y="412" width="112" height="16" rx="4" fill="#c5d0dc"/>
  <rect x="236" y="428" width="40" height="20" fill="#c5d0dc"/>
</svg>
